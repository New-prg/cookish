<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <title>Cookish</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="header-back" class="header-back-button" type="button" aria-label="Назад" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="page-title">Рацион</h1>
      <div id="ration-header-picker" class="ration-header-picker" hidden></div>
      <div id="request-header-menu-wrap" class="header-menu-wrap" hidden>
        <button id="header-more" class="header-more-button" type="button" aria-label="Меню запроса" aria-haspopup="menu" aria-expanded="false">⋮</button>
        <div id="request-header-menu" class="header-overflow-menu" role="menu" hidden>
          <button id="request-info-action" type="button" role="menuitem">Информация о товарах</button>
          <button id="request-delete-action" class="error" type="button" role="menuitem">Удалить запрос</button>
        </div>
      </div>
      <button id="header-action" class="text-button" type="button" hidden></button>
      <button id="header-profile" class="header-profile-button" type="button" aria-label="Профиль">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="app"></main>

    <button id="page-slider" class="page-slider" type="button">
      <span class="page-slider-pages">
        <span id="page-slider-prev" class="page-slider-neighbour"></span>
        <strong id="page-slider-current"></strong>
        <span id="page-slider-next" class="page-slider-neighbour"></span>
      </span>
      <span id="page-slider-modes" class="page-slider-modes">
        <span data-mode="log">учёт</span><span aria-hidden="true">·</span><span data-mode="plan">план</span>
      </span>
    </button>

    <button id="assistant-handle" class="assistant-handle" type="button" aria-label="Открыть ассистента" hidden>
      <span class="assistant-handle-grip" aria-hidden="true"></span>
      <span id="assistant-handle-badge" class="assistant-handle-badge" aria-hidden="true" hidden></span>
    </button>
    <button id="assistant-teaser" class="assistant-teaser" type="button" hidden></button>

    <dialog id="assistant-dialog" class="assistant-dialog" aria-labelledby="assistant-title">
      <header class="assistant-header">
        <div class="assistant-heading">
          <span class="eyebrow">Ассистент</span>
          <h2 id="assistant-title"></h2>
        </div>
        <div class="assistant-header-actions">
          <button id="assistant-bookmark-save" class="assistant-icon-button" type="button" aria-label="В закладки" title="В закладки" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4h10v16l-5-3.6L7 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button id="assistant-bookmarks" class="assistant-icon-button" type="button" aria-label="Закладки" title="Закладки">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 6h10M5 12h10M5 18h10M19 5v3M19 11v3M19 17v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="assistant-close" class="assistant-close" type="button" aria-label="Закрыть ассистента">×</button>
        </div>
      </header>
      <div id="assistant-feed" class="assistant-feed"></div>
      <div id="assistant-apply-bar" class="assistant-apply-bar" hidden>
        <button id="assistant-apply-all" class="button full" type="button">Применить все</button>
      </div>
      <form id="assistant-form" class="assistant-form">
        <textarea id="assistant-input" rows="1" placeholder="Сообщение ассистенту" aria-label="Сообщение ассистенту"></textarea>
        <button id="assistant-send" class="assistant-send" type="submit" aria-label="Отправить">➤</button>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite">
      <span id="toast-message"></span>
      <button id="toast-action" type="button" hidden></button>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

<!-- Запрос: Сколько я трачу на еду по неделям -->
<c-dashboard v="1">
  <h2>Траты на еду</h2>
  <p>Суммы берутся из покупок, которые вы отметили.</p>
  <c-card title="По неделям" caption="Бюджет 7000 ₽ в неделю">
    <c-bars set="set_spend" value="price" fn="sum" range="@last12w" by="week" goal="7000"></c-bars>
  </c-card>
  <c-grid cols="2">
    <c-card title="За 30 дней">
      <c-stat set="set_spend" value="price" fn="sum" range="@last30d" compare="yes" good="down"></c-stat>
    </c-card>
    <c-card title="Покупок за 30 дней">
      <c-stat set="set_spend" fn="count" range="@last30d"></c-stat>
    </c-card>
  </c-grid>
  <c-card title="Средний чек по неделям">
    <c-line set="set_spend" value="price" fn="avg" range="@last12w" by="week"></c-line>
  </c-card>
  <c-card title="Дни покупок">
    <c-heatmap set="set_spend" value="price" fn="sum" range="@last12w"></c-heatmap>
  </c-card>
  <c-card title="Последние покупки">
    <c-list set="set_spend" columns="date,price" limit="5"></c-list>
  </c-card>
  <c-empty>Новые покупки появятся здесь, когда вы отметите их в запросе.</c-empty>
</c-dashboard>

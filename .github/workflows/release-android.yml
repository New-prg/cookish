name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, for example 5.4.0. Empty means the next patch."
        required: false
        type: string
      notes:
        description: "Optional release notes"
        required: false
        type: string

run-name: ${{ inputs.version && format('Release v{0}', inputs.version) || 'Release next Android' }}

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Plan release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh release view --json tagName --jq .tagName || true)"
          EXISTING_GIT_TAGS="$(git tag --list)"
          EXISTING_RELEASE_TAGS="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          export LATEST_TAG EXISTING_GIT_TAGS EXISTING_RELEASE_TAGS
          node scripts/release-policy.mjs --from-env --github-output

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Prepare Android project
        run: npx cap sync android

      - name: Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "Android release signing secrets are not configured." >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cookish-release.jks"
          chmod 600 "$RUNNER_TEMP/cookish-release.jks"

      - name: Build signed APK
        shell: bash
        env:
          COOKISH_KEYSTORE_FILE: ${{ runner.temp }}/cookish-release.jks
          COOKISH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COOKISH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COOKISH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease \
            -PreleaseVersionName='${{ steps.version.outputs.name }}' \
            -PreleaseVersionCode='${{ steps.version.outputs.code }}'

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Cookish.apk
          sha256sum dist/Cookish.apk | tee dist/Cookish.apk.sha256
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > dist/release-notes.md
          else
            printf 'Cookish %s\n' "$VERSION" > dist/release-notes.md
          fi
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg sha256 "$(cut -d ' ' -f1 dist/Cookish.apk.sha256)" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, versionCode: $versionCode, asset: "Cookish.apk", sha256: $sha256, publishedAt: $publishedAt}' \
            > dist/update.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/Cookish.apk \
            dist/Cookish.apk.sha256 \
            dist/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cookish $VERSION" \
            --notes-file dist/release-notes.md \
            --latest

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Рацион · Сегодня — Cookish мокап</title>
  <link rel="stylesheet" href="../css/cookish.css" />
  <link rel="stylesheet" href="../css/screen-frame.css" />
</head>
<body>
  <div class="design-banner"><span>Мокап · Рацион · Сегодня</span><a href="../index.html">Все экраны</a></div>

  <header class="topbar">
    <h1 id="page-title">Рацион</h1>
    <button id="header-action" class="text-button" type="button" hidden></button>
  </header>

  <main id="app">
    <section class="ration-today">
      <header class="ration-today-header">
        <div class="ration-today-date">
          <span>воскресенье</span>
          <h2>30 августа 2026</h2>
        </div>
        <div class="ration-today-totals">
          <strong>1 710 ккал</strong>
          <span>Б 96 · Ж 58 · У 189</span>
          <em>Цель 2 100 ккал</em>
        </div>
      </header>

      <div class="ration-today-meals">

        <article class="ration-today-meal state-eaten">
          <header class="ration-today-meal-header">
            <span class="meal-event-time">08:00</span>
            <button class="ration-today-meal-open" type="button" aria-label="Открыть приём пищи Завтрак">
              <strong>Завтрак</strong>
              <span class="ration-state-chip">съедено</span>
              <small>520 ккал · Б 18 · Ж 14 · У 79</small>
            </button>
            <button class="ration-eat-button done" type="button" aria-label="Снять отметку">✓</button>
          </header>
          <ul class="ration-today-items">
            <li>Овсяные хлопья<small>60 г</small></li>
            <li>Молоко 2,5%<small>200 мл</small></li>
            <li>Бананы<small>1 шт.</small></li>
          </ul>
        </article>

        <article class="ration-today-meal state-unmarked">
          <header class="ration-today-meal-header">
            <span class="meal-event-time">13:00</span>
            <button class="ration-today-meal-open" type="button" aria-label="Открыть приём пищи Обед">
              <strong>Обед</strong>
              <span class="ration-state-chip">не отмечено</span>
              <small>780 ккал · Б 62 · Ж 28 · У 68</small>
            </button>
            <button class="ration-eat-button" type="button" aria-label="Отметить съедено">Съесть</button>
          </header>
          <ul class="ration-today-items">
            <li>Куриное филе<small>180 г</small></li>
            <li>Гречка<small>70 г</small></li>
            <li>Огурцы<small>120 г</small></li>
          </ul>
        </article>

        <article class="ration-today-meal state-unmarked">
          <header class="ration-today-meal-header">
            <span class="meal-event-time">19:00</span>
            <button class="ration-today-meal-open" type="button" aria-label="Открыть приём пищи Ужин">
              <strong>Ужин</strong>
              <span class="ration-state-chip">не отмечено</span>
              <small>410 ккал · Б 16 · Ж 16 · У 42</small>
            </button>
            <button class="ration-eat-button" type="button" aria-label="Отметить съедено">Съесть</button>
          </header>
          <ul class="ration-today-items">
            <li>Творог 5%<small>200 г</small></li>
            <li>Хлеб бородинский<small>40 г</small></li>
          </ul>
        </article>

      </div>

      <button class="keep-add-item" type="button"><span>＋</span> Добавить приём пищи</button>
    </section>

    <aside class="ration-rail" aria-label="Оверлеи рациона">
      <button class="ration-rail-flag" data-overlay="plan" type="button" aria-label="Открыть План">План</button>
      <button class="ration-rail-flag" data-overlay="history" type="button" aria-label="Открыть Историю">История</button>
    </aside>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button data-route="summary"><span aria-hidden="true">⌂</span>Сводка</button>
    <button data-route="requests"><span aria-hidden="true">≡</span>Запросы</button>
    <button data-route="ration" class="active" aria-current="page"><span aria-hidden="true">▦</span>Рацион</button>
    <button data-route="profile"><span aria-hidden="true">○</span>Профиль</button>
  </nav>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новый продукт — Cookish мокап</title>
  <link rel="stylesheet" href="../css/cookish.css" />
  <link rel="stylesheet" href="../css/screen-frame.css" />
</head>
<body>
  <div class="design-banner"><span>Мокап · Новый продукт</span><a href="../index.html">Все экраны</a></div>

  <header class="topbar">
    <h1 id="page-title">Новый продукт</h1>
    <button id="header-action" class="text-button" type="button">Отмена</button>
  </header>

  <main id="app">
    <form class="form">
      <label class="field"><span>Штрихкод</span>
        <div class="barcode-row">
          <input name="barcode" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="Например, 4605035006964">
          <button class="button secondary" type="button">Найти</button>
          <button class="button secondary" type="button">Сканировать</button>
        </div>
      </label>
      <p class="muted barcode-status">Данные предоставляет Open Food Facts. Проверьте их перед сохранением.</p>

      <label class="field"><span>Наименование</span><input name="name" required autocomplete="off" value="Творог 9%"></label>
      <label class="field"><span>Категория</span><input name="category" autocomplete="off" value="Молочные продукты"></label>
      <label class="field"><span>Единица измерения</span>
        <select name="unit">
          <option>шт.</option>
          <option>кг</option>
          <option>г</option>
          <option>л</option>
          <option selected>уп.</option>
        </select>
      </label>

      <section class="nutrition-editor">
        <h2 class="section-title">Пищевая ценность на 100 г/мл</h2>
        <div class="nutrition-grid">
          <label class="field"><span>Ккал</span><input name="calories" type="number" min="0" step="0.01" value="159"></label>
          <label class="field"><span>Белки, г</span><input name="protein" type="number" min="0" step="0.01" value="16.7"></label>
          <label class="field"><span>Жиры, г</span><input name="fat" type="number" min="0" step="0.01" value="9"></label>
          <label class="field"><span>Углеводы, г</span><input name="carbs" type="number" min="0" step="0.01" value="3"></label>
          <label class="field"><span>Клетчатка, г</span><input name="fiber" type="number" min="0" step="0.01"></label>
        </div>
        <label class="field"><span>Витамины</span><input name="vitamins" placeholder="Например: C: 10 мг; B6: 0,2 мг"></label>
        <label class="field"><span>Минералы и другие элементы</span><input name="minerals" placeholder="Например: кальций: 120 мг"></label>
        <label class="field"><span>Состав</span><textarea name="ingredients" rows="3" placeholder="Состав с этикетки"></textarea></label>
      </section>

      <button class="button full" type="submit">Сохранить</button>
    </form>
  </main>
</body>
</html>

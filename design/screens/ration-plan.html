<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Рацион · План — Cookish мокап</title>
  <link rel="stylesheet" href="../css/cookish.css" />
  <link rel="stylesheet" href="../css/screen-frame.css" />
</head>
<body>
  <div class="design-banner"><span>Мокап · Рацион · План</span><a href="../index.html">Все экраны</a></div>

  <header class="topbar">
    <h1 id="page-title">Рацион</h1>
    <button id="header-action" class="text-button" type="button" hidden></button>
  </header>

  <main id="app">
    <aside class="ration-rail" aria-label="Оверлеи рациона">
      <button class="ration-rail-flag active" data-overlay="plan" type="button" aria-label="Открыть План">План</button>
      <button class="ration-rail-flag" data-overlay="history" type="button" aria-label="Открыть Историю">История</button>
    </aside>

    <section class="ration-overlay" data-overlay="plan">
      <header class="ration-overlay-header">
        <h2>План</h2>
        <button class="text-button" type="button" aria-label="Закрыть оверлей">×</button>
      </header>
      <p class="muted">Ближайшие две недели. Нажмите на день, чтобы задать Особый день или изменить приёмы.</p>

      <div class="ration-overlay-days">
        <button class="ration-overlay-day active" type="button"><strong>31 авг</strong><span>пн</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>1 сен</strong><span>вт</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>2 сен</strong><span>ср</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>3 сен</strong><span>чт</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>4 сен</strong><span>пт</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>5 сен</strong><span>сб</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>6 сен</strong><span>вс</span><small>Завтрак · Обед · Ужин</small></button>
        <button class="ration-overlay-day" type="button"><strong>7 сен</strong><span>пн</span><small>Завтрак · Обед · Ужин</small></button>
      </div>

      <section class="ration-overlay-editor">
        <h3>31 августа 2026</h3>
        <div class="ration-day-editor">
          <div class="ration-meals">

            <article class="ration-meal">
              <header class="ration-meal-header">
                <input class="ration-meal-time" type="time" value="08:00" aria-label="Плановое время">
                <input class="ration-meal-name" value="Завтрак" aria-label="Название приёма пищи">
                <button class="remove-ration-meal" type="button" aria-label="Удалить приём пищи Завтрак">×</button>
              </header>
              <div class="ration-food-list">
                <div class="ration-food-row">
                  <span class="list-checkbox" aria-hidden="true"></span>
                  <input class="ration-food-input" value="Овсяные хлопья" placeholder="Продукт" autocomplete="off">
                  <button class="save-ration-food" type="button" aria-label="Сохранить Овсяные хлопья">✓</button>
                  <button class="ration-portion-button" type="button" aria-label="Настроить порцию">60 г<small>из 900 г</small></button>
                  <button class="remove-ration-food" type="button" aria-label="Удалить Овсяные хлопья">×</button>
                </div>
                <div class="ration-food-row">
                  <span class="list-checkbox" aria-hidden="true"></span>
                  <input class="ration-food-input" value="Бананы" placeholder="Продукт" autocomplete="off">
                  <button class="save-ration-food" type="button" aria-label="Сохранить Бананы">✓</button>
                  <button class="ration-portion-button" type="button" aria-label="Настроить порцию">1 шт.<small>из 4 шт.</small></button>
                  <button class="remove-ration-food" type="button" aria-label="Удалить Бананы">×</button>
                </div>
              </div>
              <button class="add-ration-food keep-add-item" type="button"><span>＋</span> Добавить продукт</button>
            </article>

            <article class="ration-meal">
              <header class="ration-meal-header">
                <input class="ration-meal-time" type="time" value="13:00" aria-label="Плановое время">
                <input class="ration-meal-name" value="Обед" aria-label="Название приёма пищи">
                <button class="remove-ration-meal" type="button" aria-label="Удалить приём пищи Обед">×</button>
              </header>
              <div class="ration-food-list">
                <div class="ration-food-row">
                  <span class="list-checkbox" aria-hidden="true"></span>
                  <input class="ration-food-input" value="Куриное филе" placeholder="Продукт" autocomplete="off">
                  <button class="save-ration-food" type="button" aria-label="Сохранить Куриное филе">✓</button>
                  <button class="ration-portion-button" type="button" aria-label="Настроить порцию">180 г<small>из 1 кг</small></button>
                  <button class="remove-ration-food" type="button" aria-label="Удалить Куриное филе">×</button>
                </div>
              </div>
              <button class="add-ration-food keep-add-item" type="button"><span>＋</span> Добавить продукт</button>
            </article>

          </div>
          <button class="add-ration-meal keep-add-item" type="button"><span>＋</span> Добавить приём пищи</button>
        </div>
      </section>

      <form class="ration-overlay-request">
        <h3>Запросить продукты</h3>
        <div class="ration-overlay-request-fields">
          <label><span>С</span><input type="date" value="2026-08-31"></label>
          <label><span>По</span><input type="date" value="2026-09-06"></label>
        </div>
        <button class="button full" type="submit">Создать запрос</button>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button data-route="summary"><span aria-hidden="true">⌂</span>Сводка</button>
    <button data-route="requests"><span aria-hidden="true">≡</span>Запросы</button>
    <button data-route="ration" class="active" aria-current="page"><span aria-hidden="true">▦</span>Рацион</button>
    <button data-route="profile"><span aria-hidden="true">○</span>Профиль</button>
  </nav>
</body>
</html>
